name: Guard

# Keeps the frozen directories as they were recorded and the corpus scripts proven,
# on every push to main and every pull request into main.
#
# check-frozen holds each frozen directory of the commit to the tree id recorded for
# it in frozen-trees (scripts/check-frozen.sh --rev HEAD, whose --help is the
# contract). The check that judges a change is never taken from that change: it is
# taken from the revision the change is judged against (the pull request's base, or
# the commit the push moved main from), so a change that also edits the check is
# judged by the check it started from. Only where that revision does not carry the
# check, as on the push that creates main, is it taken from the change itself, and
# the run says so. The recorded ids are the change's own: a change made to a frozen
# directory and to frozen-trees together passes here, and a consumer that must
# notice it holds the corpus to its own copy of the ids (--trees).
#
# self-tests runs scripts/test-run.sh and scripts/test-check-frozen.sh, which plant
# each fault the two scripts must refuse in scratch corpora and repositories of
# their own. Neither needs the network or a built binary.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-frozen:
    name: Frozen directories unchanged
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out with history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Take the check from the revision the change is judged against
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          rev="$BASE"
          if [ -z "$rev" ] || [ "$rev" = 0000000000000000000000000000000000000000 ] \
            || ! git cat-file -e "$rev:scripts/check-frozen.sh" 2>/dev/null; then
            echo "::notice::the revision this change is judged against does not carry the check; taking it from the change itself"
            rev=HEAD
          fi
          git show "$rev:scripts/check-frozen.sh" > "$RUNNER_TEMP/check-frozen.sh"
          echo "check-frozen: the check of $(git rev-parse --short "$rev")"

      - name: Hold every frozen directory to its recorded tree id
        run: bash "$RUNNER_TEMP/check-frozen.sh" --rev HEAD

  self-tests:
    name: Self-tests of the runner and the check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Self-test of the runner
        run: bash scripts/test-run.sh

      - name: Self-test of the check
        run: bash scripts/test-check-frozen.sh
